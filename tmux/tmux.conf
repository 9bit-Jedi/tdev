# ---- Core behavior ----
set -g mouse on                     # keyboard-only, per your requirement
set -g base-index 1                  # windows start at 1 (matches keyboard row)
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0                 # no delay entering copy-mode / vim escape
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true color for Neovim/kanagawa

# ---- Leader key ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Splits (mnemonic, keep cwd) ----
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Pane navigation: vim-style, no prefix repeat needed ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Pane resize ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Reload config ----
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# ---- Vi-style copy mode ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi r send -X rectangle-toggle

# ---- Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore pane layout + running programs
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min + restore on tmux start
set -g @plugin 'christoomey/vim-tmux-navigator' # unify Ctrl-hjkl across nvim splits AND tmux panes
set -g @plugin 'tmux-plugins/tmux-yank'         # copy-mode 'y' plays nice with system clipboard
set -g @plugin 'wfxr/tmux-fzf'                  # fzf-driven session/window/pane picker (prefix+F)

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'       # resurrect restores your Neovim session (pairs w/ resession.nvim below)

# Status bar — minimal, left = session, right = date/time, matches p10k aesthetic
set -g status-style bg=purple
set -g status-left "#[bold] #S "
set -g status-right "%Y-%m-%d %H:%M"
set -g window-status-current-style bold

run '~/.config/tmux/plugins/tpm/tpm'
